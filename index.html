<!doctype html>
<html lang="pt-BR">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Filmes Favoritos</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#17212b; --paper:#f8f5ee; --muted:#68727d; --line:#d9d2c5; --accent:#b86b3d; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"DM Sans",sans-serif; color:var(--ink); overflow-x:hidden; }
    .app-shell {
      width:100%; min-height:calc(100 * min(var(--vh, 1vh), 1vh)); padding:clamp(1.25rem,3vw,3.2rem);
      background-color:var(--paper); position:relative; isolation:isolate;
    }
    .app-shell::before {
      content:""; position:absolute; inset:0; z-index:-1; opacity:.55; pointer-events:none;
      background-image:radial-gradient(#b9afa01f .7px, transparent .8px); background-size:7px 7px;
    }
    .title-font { font-family:"Playfair Display",serif; }
    .topline { border-color:var(--line); }
    .film-grid { display:grid; grid-template-columns:repeat(9,minmax(78px,1fr)); gap:clamp(.55rem,.95vw,.95rem); }
    .film-grid { counter-reset:film; }
    .film-card::before { content:"Filme " counter(film); counter-increment:film; display:block; padding:.18rem .28rem .38rem; color:#a8663d; font-size:.62rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
    .film-card {
      position:relative; min-width:0; border:1px solid var(--line); background:#fffdf8; padding:.32rem;
      box-shadow:0 8px 18px rgba(47,38,24,.08); transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
    }
    .film-card:hover { transform:translateY(-6px) rotate(-.35deg); border-color:#bba68e; box-shadow:0 18px 32px rgba(47,38,24,.16); z-index:2; }
    .film-button { display:block; width:100%; padding:0; border:0; background:transparent; cursor:pointer; text-align:left; }
    .film-button:focus-visible,.close-button:focus-visible { outline:3px solid #286a89; outline-offset:4px; }
    .poster-wrap { position:relative; aspect-ratio:2/3; overflow:hidden; background:#e8e2d7; }
    .poster-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
    .secret-cover {
      position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:.55rem;
      background:linear-gradient(145deg,#dfe7e8,#f7eee2); color:#60717a; transition:opacity .35s ease,transform .35s ease;
    }
    .secret-cover::before { content:""; position:absolute; inset:8px; border:1px dashed #9ba9aa; }
    .secret-cover i,.secret-cover span { position:relative; }
    .secret-cover span { font-size:.65rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase; text-align:center; }
    .film-name { min-height:2.65rem; display:flex; align-items:center; padding:.52rem .28rem .18rem; }
    .film-card .poster-wrap img,.film-card .film-name { opacity:0; }
    .film-card.is-revealed .poster-wrap img,.film-card.is-revealed .film-name { opacity:1; transition:opacity .3s ease; }
    .film-card.is-revealed .secret-cover { opacity:0; transform:scale(1.06); pointer-events:none; }
    .film-card.is-revealed::after { content:"✓"; position:absolute; top:.55rem; right:.55rem; width:1.55rem; height:1.55rem; border-radius:999px; display:grid; place-items:center; background:#f8f5ee; color:#49755c; font-weight:700; box-shadow:0 2px 8px #0002; }
    dialog { width:min(92vw,720px); padding:0; border:0; background:transparent; overflow:visible; }
    dialog::backdrop { background:rgba(21,29,37,.72); backdrop-filter:blur(5px); }
    .dialog-card { position:relative; display:grid; grid-template-columns:minmax(180px,var(--modal-image-width,250px)) 1fr; width:min(92vw,var(--modal-width,720px)); max-height:90vh; overflow:hidden; border:1px solid #eee5d7; background:#fffdf8; box-shadow:0 24px 70px rgba(0,0,0,.32); }
    .dialog-poster { width:100%; height:auto; max-height:90vh; min-height:390px; object-fit:contain; display:block; background:#e8e2d7; }
     .scene-button { margin-top:1.25rem; align-self:flex-start; border:1px solid var(--line); background:#f8f5ee; padding:.65rem 1rem; font-size:.75rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; }
     .scene-button:disabled { opacity:.55; cursor:wait; }
    .dialog-copy { display:flex; flex-direction:column; justify-content:center; padding:clamp(1.5rem,4vw,3.2rem); }
    .dialog-kicker { color:#a8663d; font-size:.72rem; font-weight:700; letter-spacing:.17em; text-transform:uppercase; }
    .close-button { position:absolute; top:.75rem; right:.75rem; width:2.4rem; height:2.4rem; border:0; border-radius:999px; background:#fffdf8; color:#17212b; display:grid; place-items:center; cursor:pointer; box-shadow:0 2px 10px #0003; }
    @media (max-width:1100px){ .film-grid { grid-template-columns:repeat(6,minmax(88px,1fr)); } }
    @media (max-width:700px){ .app-shell{padding:1.1rem}.film-grid{grid-template-columns:repeat(3,minmax(82px,1fr));gap:.7rem}.dialog-card{grid-template-columns:1fr}.dialog-card{width:min(92vw,520px);max-height:92vh}.dialog-poster{max-height:55vh;min-height:0}.dialog-copy{padding:1.4rem 1.35rem 1.7rem}.film-name{min-height:2.4rem} }
  </style>
 </head>
 <body>
  <main class="app-shell">
   <header class="mx-auto w-full max-w-[1550px] border-b pb-5 sm:pb-7 topline">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
     <div>
      <p class="mb-2 text-xs font-semibold uppercase tracking-[0.26em]" style="color:var(--accent)">UMA SELEÇÃO PESSOAL</p>
      <h1 class="title-font leading-none text-4xl sm:text-5xl">Meus filmes favoritos</h1>
      <p class="mt-3 max-w-xl text-sm leading-relaxed sm:text-base" style="color:var(--muted)">Clique em cada mistério para revelar as histórias que ficaram comigo depois dos créditos finais.</p>
     </div>
     <div class="flex items-center gap-2">
      <p id="collection-label" class="border px-3 py-2 text-xs font-semibold uppercase tracking-[0.14em]" style="border-color:#d9d2c5">0 DE 17 REVELADOS</p>
      <button type="button" id="show-all-button" class="border px-3 py-2 text-xs font-semibold uppercase tracking-[0.14em]" style="border-color:#d9d2c5; background:var(--accent); color:#fffdf8; cursor:pointer;">Exibir todos</button>
     </div>
    </div>
   </header>
   <section aria-label="Coleção interativa de filmes favoritos" class="mx-auto w-full max-w-[1550px] py-6 sm:py-8">
    <div class="film-grid" id="film-grid"></div>
   </section>
   <footer class="mx-auto w-full max-w-[1550px] border-t pt-4 topline">
    <p class="text-xs italic tracking-wide" style="color:var(--muted)">Cinema é o lugar onde a memória aprende a sonhar.</p>
   </footer>
  </main>
  <dialog id="film-dialog" aria-labelledby="dialog-film-title">
   <div class="dialog-card">
    <div id="dialog-image-slot" class="dialog-poster"></div>
    <div class="dialog-copy">
     <p class="dialog-kicker">MISTÉRIO REVELADO</p>
     <h2 id="dialog-film-title" class="title-font mt-3 text-3xl font-semibold leading-tight"></h2>
     <p id="dialog-film-message" class="mt-4 text-sm leading-relaxed" style="color:var(--muted)"></p>
    </div>
    <button class="close-button" type="button" onclick="closeFilm()" aria-label="Fechar pop-up"><i data-lucide="x" width="19"></i></button>
   </div>
  </dialog>
  <script>
    // Lista de filmes: título, texto alternativo e caminho da imagem.
    // Coloque os arquivos de imagem em uma pasta "img" ao lado deste HTML,
    // nomeados exatamente como abaixo (poster-1.jpg, poster-2.jpg, ...).
    const films = [
      { title: "A Vida Secreta de Walter Mitty", alt: "Pôster do filme A Vida Secreta de Walter Mitty", img: "img/waltermitty.jpg", scene: "img/scenes/waltermitty.gif", message: "Um lembrete de que a vida real pode ser tão grande quanto qualquer devaneio, se a gente tiver coragem de sair do lugar." },
      { title: "Vidas Passadas", alt: "Pôster do filme Vidas Passadas", img: "img/vidaspassadas.jpg", scene: "img/scenes/vidaspassadas.gif", message: "Sobre os caminhos que não escolhemos e as pessoas que continuam nos formando mesmo à distância." },
      { title: "Professor Polvo", alt: "Pôster do documentário My Octopus Teacher", img: "img/myoctopus.jpg", scene: "img/scenes/myoctopus.gif", message: "Uma lição de paciência e de como os laços mais inesperados podem mudar a forma como enxergamos o mundo." },
      { title: "Bingo: O Rei das Manhãs", alt: "Pôster do filme Bingo: O Rei das Manhãs", img: "img/bingo.jpg", scene: "img/scenes/bingo.gif", message: "Por trás de todo sorriso construído para os outros, existe alguém tentando se reconhecer." },
      { title: "Brilho Eterno de uma Mente sem Lembranças", alt: "Pôster do filme Brilho Eterno de uma Mente sem Lembranças", img: "img/brilhoeterno.jpg", scene: "img/scenes/brilhoeterno.gif", message: "Uma pergunta que fica: apagaríamos a dor, mesmo sabendo que junto dela vai embora o que amamos?" },
      { title: "Moonlight", alt: "Pôster do filme Moonlight", img: "img/moonlight.jpg", scene: "img/scenes/moonlight.gif", message: "Um retrato delicado de como levamos a vida inteira para nos permitir ser quem realmente somos." },
      { title: "O Fantástico Sr. Raposo", alt: "Pôster do filme O Fantástico Sr. Raposo", img: "img/mrfox.jpg", scene: "img/scenes/mrfox.gif", message: "Sobre família, instinto e a graça de aceitar a própria natureza sem pedir desculpas por ela." },
      { title: "Pecadores", alt: "Pôster do filme Pecadores", img: "img/sinners.jpg", scene: "img/scenes/sinners.gif", message: "Uma história sobre herança, fé e os fantasmas que carregamos sem nunca ter escolhido." },
      { title: "Som do Silêncio", alt: "Pôster do filme Sound of Metal", img: "img/soundofmetal.jpg", scene: "img/scenes/soundofmetal.gif", message: "Sobre perder uma identidade inteira de uma vez e encontrar, no silêncio, um jeito novo de existir." },
      { title: "Close", alt: "Pôster do filme Close", img: "img/close.jpg", scene: "img/scenes/close.gif", message: "Uma amizade de infância, sua fragilidade e o peso do que fica sem ser dito." },
      { title: "A Chegada", alt: "Pôster do filme A Chegada", img: "img/chegada.jpg", scene: "img/scenes/arrival.gif", message: "Sobre linguagem, tempo e o que significa escolher amar mesmo sabendo o que vem depois." },
      { title: "E.T. O Extraterrestre", alt: "Pôster do filme E.T. O Extraterrestre", img: "img/et.jpg", scene: "img/scenes/et.gif", message: "O encanto puro da infância e a dor doce de uma despedida que a gente nunca esquece." },
      { title: "A Viagem de Chihiro", alt: "Pôster do filme A Viagem de Chihiro", img: "img/chihiro.jpg", scene: "img/scenes/chihiro.gif", message: "Uma prova de que a coragem aparece justamente quando tudo ao redor é estranho e desconhecido." },
      { title: "Ainda Estou Aqui", alt: "Pôster do filme Ainda Estou Aqui", img: "img/aindaestouaqui.jpg", scene: "img/scenes/aindaestouaqui.gif", message: "Sobre resistir, lembrar e manter de pé uma família mesmo quando tudo tenta apagá-la." },
      { title: "O Show de Truman", alt: "Pôster do filme O Show de Truman", img: "img/truman.jpg", scene: "img/scenes/truman.gif", message: "Uma pergunta incômoda sobre até onde vai o conforto de uma vida confortável demais para ser real." },
      { title: "Antes do Amanhecer", alt: "Pôster do filme Antes do Amanhecer", img: "img/beforesunrise.jpg", scene: "img/scenes/beforesunrise.gif", message: "A prova de que uma única noite de conversa pode significar mais do que anos inteiros." },
      { title: "O Homem do Futuro", alt: "Pôster do filme O Homem do Futuro", img: "img/homemdofuturo.jpg", scene: "img/scenes/homemdofuturo.gif", message: "Sobre voltar ao passado não para mudá-lo, mas para finalmente fazer as pazes com quem nos tornamos." }
    ];

    let activeFilm = null;
    let revealedCount = 0;
    const dialog = document.getElementById("film-dialog");
    const grid = document.getElementById("film-grid");
    const collectionLabel = document.getElementById("collection-label");

    // Monta o grid dinamicamente a partir da lista "films" acima.
    films.forEach((film, i) => {
      const index = i + 1;
      const card = document.createElement("article");
      card.className = "film-card";
      card.id = "card-" + index;
      card.innerHTML = `
        <button type="button" class="film-button" aria-label="Revelar ${film.title}" onclick="openFilm(${index})">
          <div class="poster-wrap">
            <img src="${film.img}" alt="${film.alt}" loading="lazy">
            <div class="secret-cover">
              <i data-lucide="film" width="28"></i>
              <span>CLIQUE PARA REVELAR</span>
            </div>
          </div>
          <p class="film-name text-xs font-semibold">${film.title}</p>
        </button>`;
      grid.appendChild(card);
    });

    function openFilm(index) {
      activeFilm = index;
      const film = films[index - 1];
      document.getElementById("dialog-film-title").textContent = film.title;
      document.getElementById("dialog-film-message").textContent = film.message;

      // O modal começa sempre exibindo o pôster.
      const modalImg = document.createElement("img");
      modalImg.alt = "Pôster do filme " + film.title;
      modalImg.className = "dialog-poster";
      modalImg.src = film.img;

      const imageSlot = document.getElementById("dialog-image-slot");
      imageSlot.replaceChildren(modalImg);

      const copy = document.querySelector(".dialog-copy");
      const oldButton = copy.querySelector(".scene-button");
      if (oldButton) oldButton.remove();

      const sceneButton = document.createElement("button");
      sceneButton.type = "button";
      sceneButton.className = "scene-button";
      sceneButton.textContent = "Ver cena em GIF";

      sceneButton.addEventListener("click", function() {
        if (!film.scene) return;
        sceneButton.disabled = true;
        sceneButton.textContent = "Carregando cena...";

        const sceneImg = new Image();
        sceneImg.onload = function() {
          modalImg.src = film.scene;
          modalImg.alt = "Cena do filme " + film.title;
          sceneButton.disabled = false;
          sceneButton.textContent = "Voltar ao pôster";
          resizeModal(sceneImg.naturalWidth, sceneImg.naturalHeight);
        };
        sceneImg.onerror = function() {
          sceneButton.disabled = false;
          sceneButton.textContent = "GIF indisponível";
        };
        sceneImg.src = film.scene;
      });

      sceneButton.addEventListener("click", function() {
        if (sceneButton.textContent === "Voltar ao pôster") {
          modalImg.src = film.img;
          modalImg.alt = "Pôster do filme " + film.title;
          sceneButton.textContent = "Ver cena em GIF";
          modalImg.onload = function() {
            resizeModal(modalImg.naturalWidth, modalImg.naturalHeight);
          };
        }
      });

      copy.appendChild(sceneButton);

      function resizeModal(imageWidth, imageHeight) {
        const card = dialog.querySelector(".dialog-card");
        const maxImageWidth = Math.floor(window.innerWidth * (window.innerWidth <= 700 ? 0.92 : 0.55));
        const maxImageHeight = Math.floor(window.innerHeight * 0.82);
        const ratio = imageWidth / imageHeight;
        let width = Math.min(imageWidth, maxImageWidth);
        let height = width / ratio;
        if (height > maxImageHeight) {
          height = maxImageHeight;
          width = height * ratio;
        }
        const copyWidth = window.innerWidth <= 700 ? 0 : 420;
        const modalWidth = Math.min(window.innerWidth * 0.92, width + copyWidth);
        card.style.setProperty("--modal-image-width", width + "px");
        card.style.setProperty("--modal-width", modalWidth + "px");
      }

      modalImg.onload = function() {
        resizeModal(modalImg.naturalWidth || 250, modalImg.naturalHeight || 375);
      };

      dialog.showModal();
    }

    function closeFilm() {
      if (activeFilm) {
        const card = document.getElementById("card-" + activeFilm);
        if (!card.classList.contains("is-revealed")) {
          card.classList.add("is-revealed");
          revealedCount++;
          collectionLabel.textContent = revealedCount + " DE " + films.length + " REVELADOS";
        }
      }
      dialog.close();
    }

    function showAllFilms() {
      films.forEach((film, i) => {
        const index = i + 1;
        const card = document.getElementById("card-" + index);
        if (card && !card.classList.contains("is-revealed")) {
          card.classList.add("is-revealed");
          revealedCount++;
        }
      });
      collectionLabel.textContent = revealedCount + " DE " + films.length + " REVELADOS";
    }

    document.getElementById("show-all-button").addEventListener("click", showAllFilms);

    dialog.addEventListener("click", function(event) {
      if (event.target === dialog) closeFilm();
    });

    dialog.addEventListener("cancel", function(event) {
      event.preventDefault();
      closeFilm();
    });

    document.addEventListener("DOMContentLoaded", function() {
      lucide.createIcons();
    });
  </script>
 </body>
</html>
